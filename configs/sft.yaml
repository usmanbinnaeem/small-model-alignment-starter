# Task 3: SFT. Guide values from the assignment (section 9.2).
model: Qwen/Qwen2.5-0.5B
train_path: data/prepared/sft_train.jsonl
val_path: data/prepared/sft_val.jsonl
out_dir: outputs/sft
max_length: 512
batch_size: 2
grad_accum: 16          # effective batch 32
eval_batch_size: 8
lr: 2.0e-5
warmup_ratio: 0.03
weight_decay: 0.1
max_grad_norm: 1.0
epochs: 1
eval_every: 100         # optimizer steps (~938 total)
log_every: 10
fp16: true
seed: 42
time_limit_hours: 10.5  # stop and save before Kaggle's 12 h session limit
