# Task 5 v1: persona DPO with TRL DPOTrainer + LoRA on SmolLM2-360M-Instruct (first attempt; over-optimized).
model: HuggingFaceTB/SmolLM2-360M-Instruct
data_path: data/persona_lora/ramsay_style_preferences.json
out_dir: outputs/lora_dpo
n_eval: 20              # held-out pairs for reward accuracy; 200 train
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
lr: 5.0e-5
beta: 0.1
batch_size: 4
grad_accum: 2           # effective batch 8 -> 75 optimizer steps over 3 epochs
epochs: 3
warmup_ratio: 0.1
max_length: 256
eval_steps: 5
fp16: true
seed: 42
